  if (clicsLogo >= 5) { clicsLogo = 0; ouvrirAdmin(); }
});

const duree = s => { s = +s || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ' h ' : '') + (h || m ? String(m).padStart(h ? 2 : 1, '0') + ' min ' : '') + (h ? '' : String(x).padStart(2, '0') + ' s'); };
function msgAdmin(txt, erreur) { $('adMsg').textContent = txt; $('adMsg').classList.toggle('err', !!erreur); }
function ouvrirAdmin() {   // sans mot de passe côté Supabase, le panneau s'ouvre directement
  $('ecranAdmin').hidden = false; $('adConnexion').hidden = true;
  chargerAdmin();
}
function fermerAdmin() {
  $('ecranAdmin').hidden = true;
  for (const c of ['listeSprint', 'listeCarriere']) chargerClassement(c);
  if (!$('ecranFin').hidden) chargerClassement('listeFin');
}
$('adFermer').addEventListener('click', fermerAdmin);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ecranAdmin').hidden) fermerAdmin(); });
$('adConnexion').addEventListener('submit', e => { e.preventDefault(); admin.mdp = $('adMdp').value; admin.saisi = true; $('adMdp').value = ''; chargerAdmin(); });
for (const v of ['parties', 'carrieres']) $('adVue' + v.charAt(0).toUpperCase() + v.slice(1)).addEventListener('click', () => {
  admin.vue = v;
  $('adVueParties').classList.toggle('actif', v === 'parties'); $('adVueCarrieres').classList.toggle('actif', v === 'carrieres');
  $('adVider').hidden = v !== 'parties';
  if (admin.mdp) chargerAdmin();
});

function erreurAdmin(e) {
  if (/Mot de passe incorrect/.test(e.message)) {
    admin.mdp = ''; $('adConnexion').hidden = false; $('adContenu').hidden = true;
    msgAdmin(admin.saisi ? 'Mot de passe incorrect.' : 'Un mot de passe organisateur est défini dans Supabase.', !!admin.saisi); $('adMdp').focus();
  } else if (/check constraint/.test(e.message)) msgAdmin('Valeur refusée : le score doit être entre 0 et 100 000, le pseudo faire 1 à 24 caractères.', true);
  else if (e.reseau) msgAdmin('Impossible de joindre Supabase (' + CONFIG.supabaseUrl + ') depuis ce poste : le réseau de l\'entreprise, un proxy ou la page (SharePoint) bloque la connexion. Ouvrez la console (F12) pour voir le message exact.', true);
  else msgAdmin('Erreur : ' + e.message, true);
}

async function chargerAdmin(message) {
  msgAdmin('Chargement…');
  try {
    admin.lignes = await sb('/rest/v1/rpc/' + (admin.vue === 'parties' ? 'admin_scores' : 'admin_carrieres'), { mdp: admin.mdp });
    $('adConnexion').hidden = true; $('adContenu').hidden = false;
    msgAdmin(message || '');
    afficherAdmin();
  } catch (e) { erreurAdmin(e); }
}

function afficherAdmin() {
  const f = $('adFiltre').value.trim().toLowerCase();
  const lignes = admin.lignes.filter(l => !f || (l.login || '').includes(f) || l.pseudo.toLowerCase().includes(f));
  const parties = admin.vue === 'parties';
  $('adTete').innerHTML = parties
    ? '<tr><th><input type="checkbox" id="adTout"></th><th>Date</th><th>Login</th><th>Pseudo</th><th>Mode</th><th>Score</th><th>🔧</th><th>🛡️</th><th>🔁</th><th>Dispo</th><th>⏱ Temps</th><th>Langue</th><th></th></tr>'
    : '<tr><th><input type="checkbox" id="adTout"></th><th>Pseudo</th><th>Login</th><th>Jour</th><th>Énergie cumulée</th><th>Budget</th><th>⏱ Temps total</th><th>Créée le</th><th>Dernière partie</th></tr>';
  $('adTout').addEventListener('change', () => { document.querySelectorAll('.adCoche').forEach(c => { c.checked = $('adTout').checked; }); majSelection(); });
  const tb = $('adLignes'); tb.replaceChildren();
  const cellule = (tr, contenu, cls) => { const td = document.createElement('td'); if (cls) td.className = cls; td.append(contenu); tr.append(td); return td; };
  const date = d => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
  for (const l of lignes) {
    const tr = document.createElement('tr'); tr.dataset.id = parties ? l.id : l.cle;
    const coche = document.createElement('input'); coche.type = 'checkbox'; coche.className = 'adCoche';
    cellule(tr, coche);
    if (!parties) {
      cellule(tr, l.pseudo); cellule(tr, l.login || '—', 'login-c'); cellule(tr, 'J' + l.jour);
      const fr = n => Math.round(n).toLocaleString('fr-FR');
      cellule(tr, fr(l.total_mwh) + ' MWh'); cellule(tr, fr(l.budget) + ' k€'); cellule(tr, duree(l.temps_jeu));
      cellule(tr, date(l.cree_le)); cellule(tr, date(l.maj));
      tb.append(tr); continue;
    }
    cellule(tr, date(l.created_at));
    cellule(tr, l.login, 'login-c').title = l.login + ({ windows: ' (Windows)', sharepoint: ' (Microsoft 365)' }[l.source] || ' (saisi)');
    const ps = document.createElement('input'); ps.type = 'text'; ps.maxLength = 24; ps.value = l.pseudo;
    cellule(tr, ps);
    cellule(tr, l.mode === 'carriere' ? '🧭 carrière J' + l.jour : '⚡ sprint');
    const sc = document.createElement('input'); sc.type = 'number'; sc.min = 0; sc.max = 100000; sc.value = l.score;
    cellule(tr, sc);
    cellule(tr, String(l.reparations)); cellule(tr, String(l.ameliorations)); cellule(tr, '×' + l.combo_max);
    cellule(tr, l.disponibilite + ' %'); cellule(tr, duree(l.temps_jeu)); cellule(tr, l.langue || '');
    const actions = document.createElement('span');
    const enr = document.createElement('button'); enr.className = 'btn ok'; enr.type = 'button'; enr.textContent = '💾'; enr.title = 'Enregistrer'; enr.disabled = true;
    const sup = document.createElement('button'); sup.className = 'btn danger'; sup.type = 'button'; sup.textContent = '🗑'; sup.title = 'Supprimer'; sup.style.marginLeft = '6px';
    actions.append(enr, sup); cellule(tr, actions);
    const changer = () => { const m = ps.value.trim() !== l.pseudo || +sc.value !== l.score; enr.disabled = !m; tr.classList.toggle('modifie', m); };
    ps.addEventListener('input', changer); sc.addEventListener('input', changer);
    enr.addEventListener('click', async () => {
      try {
        await sb('/rest/v1/rpc/admin_modifier', { mdp: admin.mdp, p_id: l.id, p_pseudo: ps.value, p_score: Math.round(+sc.value) });
        await chargerAdmin('Partie de « ' + ps.value.trim() + ' » enregistrée.');
      } catch (e) { erreurAdmin(e); }
    });
    sup.addEventListener('click', () => supprimerAdmin([l.id]));
    tb.append(tr);
  }
  if (!lignes.length) { const tr = document.createElement('tr'); const td = cellule(tr, f ? 'Aucune ligne ne correspond.' : 'Rien pour l\'instant.', 'vide'); td.colSpan = 13; tb.append(tr); }
  const total = lignes.reduce((s, l) => s + (+l.temps_jeu || 0), 0);
  $('adCompte').textContent = lignes.length + ' / ' + admin.lignes.length + (parties ? ' parties' : ' carrières') + ' · ⏱ ' + duree(total) + ' de jeu';
  majSelection();
}

function selectionAdmin() { return [...document.querySelectorAll('.adCoche:checked')].map(c => c.closest('tr').dataset.id); }
function majSelection() { const n = selectionAdmin().length; $('adSuppr').disabled = !n; $('adSuppr').textContent = '🗑 Supprimer la sélection' + (n ? ' (' + n + ')' : ''); }
$('adLignes').addEventListener('change', e => { if (e.target.classList.contains('adCoche')) majSelection(); });
$('adFiltre').addEventListener('input', afficherAdmin);
$('adRafraichir').addEventListener('click', () => chargerAdmin());
$('adSuppr').addEventListener('click', () => supprimerAdmin(selectionAdmin()));

async function supprimerAdmin(ids) {
  const parties = admin.vue === 'parties';
  if (!ids.length || !confirm('Supprimer définitivement ' + ids.length + (parties ? ' partie(s) ?' : ' carrière(s) ?'))) return;
  try {
    const n = parties
      ? await sb('/rest/v1/rpc/admin_supprimer', { mdp: admin.mdp, p_ids: ids.map(Number) })
      : await sb('/rest/v1/rpc/admin_supprimer_carrieres', { mdp: admin.mdp, p_cles: ids });
    await chargerAdmin(n + (parties ? ' partie(s) supprimée(s).' : ' carrière(s) supprimée(s).'));
  } catch (e) { erreurAdmin(e); }
}
$('adVider').addEventListener('click', async () => {
  if (prompt('Cela supprime TOUTES les parties (les carrières restent).\nTapez EFFACER pour confirmer :') !== 'EFFACER') return;
  try {
    const n = await sb('/rest/v1/rpc/admin_vider', { mdp: admin.mdp });
    await chargerAdmin('Parties remises à zéro (' + n + ' supprimées).');
  } catch (e) { erreurAdmin(e); }
});

/* =====================================================================
   Boucle et démarrage
   ===================================================================== */
let avant = performance.now();
function boucle(maintenant) {
  const dt = Math.min(.05, (maintenant - avant) / 1000); avant = maintenant;
  if (etat === 'jeu') { majPartie(dt); if (etat === 'jeu') majHud(); }
  majCommun(dt);
  if ($('ecranAccueil').hidden) dessiner();
  requestAnimationFrame(boucle);
}

$('pseudo').value = joueur.pseudo;
$('pseudo').addEventListener('input', () => { $('infoErreur').textContent = ''; majBoutonJouer(); });
$('pseudo').addEventListener('keydown', e => { if (e.key === 'Enter') demarrer(); });
$('code').addEventListener('input', () => { $('code').value = $('code').value.replace(/\D/g, '').slice(0, 4); });
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') demarrer(); });
$('btnJouer').addEventListener('click', demarrer);
$('btnRejouer').addEventListener('click', lancerJournee);
function retourAccueil() {
  etat = 'accueil'; partie = null;
  for (const id of ['ecranFin', 'ecranBase', 'ecranReleve', 'hud', 'file']) $(id).hidden = true;
  $('ecranAccueil').hidden = false; ongletAccueil('pAccueil');
  eoliennes.forEach(e => { e.marche = true; e.coupe = false; e.alerte = 0; });
  majCarteCarriere();
  for (const c of ['listeSprint', 'listeCarriere']) chargerClassement(c);
}
$('btnAccueil').addEventListener('click', retourAccueil);
$('btnBaseAccueil').addEventListener('click', retourAccueil);
addEventListener('keydown', e => { if (etat === 'fin' && !$('ecranFin').hidden && $('ecranAdmin').hidden && e.key === 'Enter') lancerJournee(); });
addEventListener('resize', redimensionner);
redimensionner();
setInterval(majRebours, 1000);
carriere = carriereLocale();
choisirMode(modeChoisi);
appliquerLangue();
detecterCompteSharePoint();
requestAnimationFrame(boucle);
</script>
</body>
