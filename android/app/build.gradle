plugins { id 'com.android.application' }

android {
    namespace 'fr.soaresden.msczplayer'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.soaresden.msczplayer'
        minSdk 26
        targetSdk 35
        versionCode 67
        versionName '1.0.5'
    }
    signingConfigs {
        release {
            storeFile file('../keystore/msczplayer.jks')
            storePassword 'msczplayer'
            keyAlias 'msczplayer'
            keyPassword 'msczplayer'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
    androidResources {
        noCompress += ['wasm', 'data', 'mjs', 'js']
    }
    sourceSets {
        main { assets.srcDirs += [layout.buildDirectory.dir('generated/www')] }
    }
}

// Copie l'appli web (../../web) dans les assets sous www/
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('../web'))
    into layout.buildDirectory.dir('generated/www/www')
}
tasks.named('preBuild') { dependsOn copyWeb }

